<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Atalhos do teclado · Entrelinhas</title>
  </head>
  <body>
    <div class="sheet">
      <header class="running-head">Entrelinhas</header>
      <main class="page">
        <h1 class="title">Atalhos do teclado</h1>
        <p class="intro">
          Valem no YouTube e nos sites que você ativou, com a legenda dupla ligada. Num site que usa
          a mesma tecla, vale a da extensão. Não funcionam enquanto você digita.
        </p>
        <p class="notice" hidden></p>
        <ul class="shortcuts" hidden></ul>
        <div class="footer" hidden>
          <button class="reset ink-button" type="button">Voltar às teclas padrão</button>
          <p class="reset-message" hidden></p>
        </div>
        <p class="announcer" role="status"></p>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
