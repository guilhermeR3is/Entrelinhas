<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Fake YouTube</title>
    <style>
      html {
        font-size: 10px;
      }
      body {
        margin: 0;
        background: #0f0f0f;
      }
      #movie_player {
        position: relative;
        width: 854px;
        height: 480px;
        overflow: hidden;
      }
      .html5-video-container {
        position: absolute;
        inset: 0;
        z-index: 10;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ytp-caption-window-container {
        position: absolute;
        inset: 0;
      }
      .ytp-chrome-bottom {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 59;
        height: 59px;
        background: rgb(0 0 0 / 0.5);
      }
      .ytp-settings-menu {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2300;
      }
      .ytp-fullscreen-button {
        position: absolute;
        right: 12px;
        bottom: 12px;
      }
      html:fullscreen #movie_player {
        width: 100vw;
        height: 100vh;
      }
      #full-bleed-container #movie_player {
        width: 1280px;
        height: 631px;
      }
    </style>
  </head>
  <body>
    <input id="search" aria-label="Pesquisar" />
    <div id="full-bleed-container"></div>
    <div id="player-container">
      <div id="movie_player" class="html5-video-player playing-mode">
        <div class="html5-video-container">
          <video src="/clock.webm" muted loop preload="auto"></video>
        </div>
        <div id="ytp-caption-window-container"></div>
        <div class="ytp-settings-menu">
          <button class="ytp-speed-option" type="button" data-rate="1.5">1,5</button>
        </div>
        <div class="ytp-chrome-bottom">
          <button class="ytp-fullscreen-button" type="button">Tela cheia</button>
        </div>
      </div>
    </div>
    <script>
      const player = document.getElementById('movie_player');
      const video = player.querySelector('video');
      const keysSeen = [];
      let rememberedSpeed = 1;
      let reloading = false;

      window.addEventListener(
        'ratechange',
        (event) => {
          if (reloading) event.stopImmediatePropagation();
        },
        true,
      );

      document.addEventListener('keydown', (event) => keysSeen.push(event.key));
      document.querySelector('.ytp-speed-option').addEventListener('click', (event) => {
        rememberedSpeed = Number(event.currentTarget.dataset.rate);
        video.playbackRate = rememberedSpeed;
      });

      document.querySelector('.ytp-fullscreen-button').addEventListener('click', () => {
        document.documentElement.requestFullscreen();
      });

      function loadCaptions(lang = 'en', kind = '') {
        const videoId = new URL(location.href).searchParams.get('v');
        if (videoId === 'no-captions') return;
        const request = new XMLHttpRequest();
        const kindParam = kind ? `&kind=${kind}` : '';
        request.open(
          'GET',
          `/api/timedtext?v=${videoId}&lang=${lang}${kindParam}&fmt=json3&pot=local-test-token`,
        );
        request.send();
      }

      window.fakePlayer = {
        startAd: () => player.classList.add('ad-showing'),
        endAd: () => player.classList.remove('ad-showing'),
        hideControls: () => player.classList.add('ytp-autohide'),
        showControls: () => player.classList.remove('ytp-autohide'),
        enterTheaterMode: () => {
          document.getElementById('full-bleed-container').append(player);
        },
        replaceCaptionContainer: () => {
          const fresh = document.createElement('div');
          fresh.id = 'ytp-caption-window-container';
          document.getElementById('ytp-caption-window-container').replaceWith(fresh);
        },
        loadPortuguese: () => loadCaptions('pt-BR'),
        loadAutomaticPortuguese: () => loadCaptions('pt', 'asr'),
        showScreenCaption: (text) => {
          const line = document.createElement('span');
          line.className = 'caption-visual-line';
          line.textContent = text;
          document.getElementById('ytp-caption-window-container').replaceChildren(line);
        },
        openVideo: (videoId) => {
          history.pushState({}, '', `/watch?v=${videoId}`);
          reloading = true;
          video.addEventListener('loadstart', () => (reloading = false), { once: true });
          video.load();
          loadCaptions();
          setTimeout(() => {
            video.playbackRate = rememberedSpeed;
          }, 100);
        },
        keysSeen: () => keysSeen,
      };

      loadCaptions();
    </script>
  </body>
</html>
