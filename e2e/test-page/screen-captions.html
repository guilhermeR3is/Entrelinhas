<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen captions</title>
    <style>
      body {
        margin: 2rem;
        font-family: system-ui, sans-serif;
      }
      .fp-player {
        position: relative;
        width: 480px;
        height: 270px;
      }
      .fp-player video {
        display: block;
        width: 100%;
        height: 100%;
      }
      .fp-captions {
        position: absolute;
        right: 0;
        bottom: 12px;
        left: 0;
        text-align: center;
      }
      .fp-line {
        display: inline-block;
        padding: 2px 6px;
        background: rgb(0 0 0 / 0.75);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>A lesson whose player draws its own captions</h1>
    <div class="fp-player">
      <video src="clock.webm" muted preload="auto"></video>
      <div class="fp-captions" aria-live="off"></div>
    </div>
    <script>
      const cues = [
        [0.5, 2.5, 'Hello, this is the test page.'],
        [2.5, 4, 'Cues can touch end to end.'],
        [10.5, 11.5, 'After a gap.'],
      ];
      const video = document.querySelector('video');
      const captions = document.querySelector('.fp-captions');
      let shown = null;
      const draw = () => {
        const cue = cues.find(
          ([start, end]) => video.currentTime >= start && video.currentTime < end,
        );
        const text = cue ? cue[2] : null;
        if (text === shown) return;
        shown = text;
        const line = document.createElement('span');
        line.className = 'fp-line';
        line.textContent = text ?? '';
        captions.replaceChildren(...(text ? [line] : []));
      };
      const everyFrame = () => {
        draw();
        if (!video.paused) requestAnimationFrame(everyFrame);
      };
      video.addEventListener('playing', everyFrame);
      video.addEventListener('timeupdate', draw);
    </script>
  </body>
</html>
